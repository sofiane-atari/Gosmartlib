services:
  traefik:
    image: "traefik:v3.2"
    container_name: "traefik"
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.file.filename=/etc/traefik/dynamicconfig.yml"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=s140265@ap.be"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--serverstransport.forwardingtimeouts.dialtimeout=30s"
      - "--serverstransport.forwardingtimeouts.responseheadertimeout=60s"
      - "--entryPoints.traefik.address=:8080"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "./dynamicconfig.yml:/etc/traefik/dynamicconfig.yml"
      - "./staticconfig.yml:/etc/traefik/staticconfig.yml"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - proxy

  frontend:
    build: ../bib-frontend
    depends_on:
      - backend
      - traefik
    # ports:
    #   - "4200:4200"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`$DOMAIN`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
    networks:
      - proxy

  backend:
    build: ../bib-backend
    container_name: spring-boot-app
    restart: on-failure
    depends_on:
      - mysql
      - traefik
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      # SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bib_systeem?allowPublicKeyRetrieval=true&useSSL=false
      # SPRING_DATASOURCE_USERNAME: root
      # SPRING_DATASOURCE_PASSWORD: root
      # SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      # SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      # SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # SERVER_PORT: 8080
      # JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`$DOMAIN`) && PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.docker.network=proxy"
    networks:
      - proxy

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    # depends_on:
    #   - traefik
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "bib_systeem"
      # MYSQL_USER: "root"
      # MYSQL_PASSWORD: "root"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - proxy

volumes:
  mysql-data:

networks:
  proxy:
