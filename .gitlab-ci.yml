stages:
  - deploy

variables:
  TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  TAG_COMMIT: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  GITLAB_USER_LOC: $GITLAB_USER
  GITLAB_USER_AUTH_LOC: $GITLAB_USER_AUTH
  DIR: project
  REPO_URL: https://$GITLAB_USER_LOC:$GITLAB_USER_AUTH_LOC@gitlab.apstudent.be/bachelor-it/software-$DIR/25-26/team-02/gosmartlib.git

deploy:
  image: alpine:latest
  stage: deploy
  tags:
    - deployment
  script:
    - chmod og= $ID_25519
    - apk update && apk add openssh-client

    # Pulling/cloning
    - |
      ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP <<- EOF
      if [[ -d "$DIR/.git/" && -e "$DIR/.git/" ]]; then
        cd "$DIR/"
        git pull
      else
        rm -rf "$DIR/"
        mkdir "$DIR/"
        git clone $REPO_URL "$DIR/."
      fi
      EOF

    # .env variables
    - |
      ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP <<- EOF
      cat <<- EOF2 > $DIR/traefik/.env
      DOMAIN=$DOMAIN
      EOF2
      EOF

    # Run the services
    - ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker compose --project-directory $DIR/ build"
    - ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker compose  --project-directory $DIR/ up -d"
    
  environment:
    name: production
    url: http://195.201.32.128 
  only:
    - main
