stages:
  - deploy

variables:
  DIR: gosmartlib
  REPO_URL: https://$GITLAB_USER:$GITLAB_USER_AUTH@$GITLAB_DOMAIN/$PROJECT_PATH
  DB_PATH: $DIR/bib-backend/$DB_NAME.sql

deploy:
  image: alpine:latest
  stage: deploy
  tags:
    - deployment
  script:
    - chmod og= $ID_25519
    - apk update && apk add openssh-client
    # Pulling/cloning
    - |
      ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP <<- EOF
      set -e
      rm -rf "$DIR"
      git clone --depth 1 --branch main $REPO_URL "$DIR"
      EOF
    # .env variables
    - |
      ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP <<- EOF
      set -e
      cat <<- EOF2 > $DIR/.env
      DOMAIN=$DOMAIN
      DB_HOST=$DB_HOST
      DB_PORT=$DB_PORT
      DB_NAME=$DB_NAME
      DB_ROOT_PASS=$DB_ROOT_PASS
      DB_USER=$DB_USER
      DB_USER_PASS=$DB_USER_PASS
      SPRING_PORT=$SPRING_PORT
      BOOKS_API_KEY=$BOOKS_API_KEY
      APP_CORS_ALLOWED_ORIGINS=$APP_CORS_ALLOWED_ORIGINS
      BASE_URL=$BASE_URL
      SMART_SCHOOL_CLIENT_ID=$SMART_SCHOOL_CLIENT_ID
      SMART_SCHOOL_CLIENT_SECRET=$SMART_SCHOOL_CLIENT_SECRET
      JWT_SECRET=$JWT_SECRET
      FRONTEND_REDIRECT_URL=$FRONTEND_REDIRECT_URL
      ONE_ROSTER_CLIENT_ID=$ONE_ROSTER_CLIENT_ID
      ONE_ROSTER_CLIENT_SECRET=$ONE_ROSTER_CLIENT_SECRET

      EOF2
      EOF
    # Run the services
    - ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker compose --project-directory $DIR/ build --no-cache"
    - ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker compose --project-directory $DIR/ up -d"
    # Waiting till the database fully has started
    - |
      ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP <<- EOF
      set -e
      echo "Waiting for MySQL to be ready..."
      until docker compose --project-directory $DIR/ exec -T mysql mysql -u root -p$DB_ROOT_PASS -e "SELECT 1 FROM mysql.user LIMIT 1" --connect-timeout=5; do
        sleep 2
      done
      echo "MySQL is ready!"
      EOF
    # Replacing the old database with the new one
    - |
      ssh -i $ID_25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP <<- EOF
      set -e
      docker compose --project-directory $DIR/ exec -T mysql \
      mysql -u root -p$DB_ROOT_PASS $DB_NAME < $DB_PATH
      EOF
  environment:
    name: production
    url: http://${SERVER_IP}
  only:
    - main