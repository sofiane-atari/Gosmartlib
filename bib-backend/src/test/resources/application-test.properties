spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.servlet.context-path=/api

jwt.secret=test-secret-test-secret-test-secret
jwt.expiration=3600000
JASYPT_ENCRYPTOR_PASSWORD=test-encryption-password

app.didactic-material.attachments-directory=build/test-uploads

# spring.data.redis.host=localhost
# spring.data.redis.port=6379

spring.security.oauth2.client.registration.smartschool.client-id=test-client
spring.security.oauth2.client.registration.smartschool.client-secret=test-secret
spring.security.oauth2.client.registration.smartschool.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.smartschool.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool.redirect-uri=http://localhost/login/oauth2/code/smartschool
spring.security.oauth2.client.registration.smartschool.scope=fulluserinfo,groupinfo,sendnotif
spring.security.oauth2.client.registration.smartschool.client-name=Smartschool

spring.security.oauth2.client.provider.smartschool.authorization-uri=https://example.com/oauth/authorize
spring.security.oauth2.client.provider.smartschool.token-uri=https://example.com/oauth/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=https://example.com/userinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=userID

oneroster.client-id=test
oneroster.client-secret=test
oneroster.token-path=/ims/oneroster/token
oneroster.api-path=/ims/oneroster/v1p1
oneroster.allowed-host-suffixes=.smartschool.be
oneroster.connect-timeout-ms=5000
oneroster.read-timeout-ms=7000
oneroster.token-auth-method=auto
oneroster.scope=

smartschool.fulluserinfo-url=https://example.com/fulluserinfo
smartschool.groupinfo-url=https://example.com/groupinfo
frontend.redirect-url=http://localhost:4200/login

app.real-school-domains=

admin.override.enabled=true
admin.override.ttl-minutes=30
admin.override.localhost-only=false

app.dev-mode-enabled=true
