spring.application.name=bib-backend

# Database connectie (pas wachtwoord aan!)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_USER_PASS}
server.port=${SPRING_PORT}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate instellingen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Vertrouw de headers die Traefik doorgeeft (zoals X-Forwarded-Proto)
server.forward-headers-strategy=framework

server.servlet.context-path=/api
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# OAuth2 Client Registration
spring.security.oauth2.client.registration.smartschool.client-id=${SMART_SCHOOL_CLIENT_ID}
spring.security.oauth2.client.registration.smartschool.client-secret=${SMART_SCHOOL_CLIENT_SECRET}
spring.security.oauth2.client.registration.smartschool.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.smartschool.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool.redirect-uri=https://${BASE_URL}/api/login/oauth2/code/smartschool
spring.security.oauth2.client.registration.smartschool.scope=fulluserinfo,groupinfo
spring.security.oauth2.client.registration.smartschool.client-name=Smartschool

# OneRoster API
oneroster.client-id=${ONE_ROSTER_CLIENT_ID}
oneroster.client-secret=${ONE_ROSTER_CLIENT_SECRET}
  # Client-credentials token endpoint voor OneRoster toegang
oneroster.token-url=https://oauth.smartschool.be/OAuth/index/token
# API path wordt gecombineerd met de gevalideerde schoolhost uit de JWT schoolCode claim
oneroster.api-path=/ims/oneroster/v1p1
# Alleen hosts binnen deze suffixes zijn toegestaan om SSRF te beperken
oneroster.allowed-host-suffixes=.smartschool.be
oneroster.connect-timeout-ms=5000
oneroster.read-timeout-ms=7000
# Token auth method: basic, post, of auto
oneroster.token-auth-method=auto
# Optionele scope voor providers die scope verplichten bij client_credentials
oneroster.scope=
# Token endpoint mode: global, school of auto (probeert beide)
oneroster.token-endpoint-mode=auto

# OAuth2 Provider
spring.security.oauth2.client.provider.smartschool.authorization-uri=https://oauth.smartschool.be/OAuth
spring.security.oauth2.client.provider.smartschool.token-uri=https://oauth.smartschool.be/OAuth/index/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=https://oauth.smartschool.be/Api/V1/fulluserinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=userID

# Logging
logging.level.org.springframework.security=DEBUG

google.books.api.key=${BOOKS_API_KEY}

logging.level.org.springframework.web.client=INFO
logging.level.org.springframework.security.oauth2=TRACE
logging.level.edu.ap.bib_backend.interceptor=DEBUG

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

smartschool.fulluserinfo-url=https://aphogeschool.smartschool.be/Api/V1/fulluserinfo
smartschool.groupinfo-url=https://aphogeschool.smartschool.be/Api/V1/groupinfo
frontend.redirect-url=${FRONTEND_REDIRECT_URL:http://localhost:4200/login}

# TEMP_ADMIN_OVERRIDE TIJDELIJK VOOR PRODUCTIE MOET WORDEN UITGESCHAKELD, MAAR IN TESTOMGEVINGEN AANBLIJVEN
admin.override.enabled=true
admin.override.ttl-minutes=30
admin.override.localhost-only=false

app.book-upload-temp-dir=/tmp/book-uploads