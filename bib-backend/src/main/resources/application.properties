spring.application.name=bib-backend

# Database connectie (pas wachtwoord aan!)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_USER_PASS}
server.port=${SPRING_PORT}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate instellingen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Vertrouw de headers die Traefik doorgeeft (zoals X-Forwarded-Proto)
server.forward-headers-strategy=framework

server.servlet.context-path=/api
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# OAuth2 Client Registration
spring.security.oauth2.client.registration.smartschool.client-id=${SMART_SCHOOL_CLIENT_ID}
spring.security.oauth2.client.registration.smartschool.client-secret=${SMART_SCHOOL_CLIENT_SECRET}
spring.security.oauth2.client.registration.smartschool.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.smartschool.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool.redirect-uri=${BASE_URL}/api/login/oauth2/code/smartschool
spring.security.oauth2.client.registration.smartschool.scope=userinfo,fulluserinfo,groupinfo,sendmessage,sendnotif
spring.security.oauth2.client.registration.smartschool.client-name=Smartschool

# OneRoster API
# Token path for OneRoster API access
oneroster.token-path=/ims/oneroster/token
# Optional base URL override (empty = use https://{host} from school domain)
oneroster.base-url=
# API path is combined with the validated school host from the JWT schoolCode claim
oneroster.api-path=/ims/oneroster/v1p1
# Alleen hosts binnen deze suffixes zijn toegestaan om SSRF te beperken
oneroster.allowed-host-suffixes=.smartschool.be
oneroster.connect-timeout-ms=5000
oneroster.read-timeout-ms=7000
# Token auth method: basic, post, of auto
oneroster.token-auth-method=auto
# Optionele scope voor providers die scope verplichten bij client_credentials
oneroster.scope=


# Smartschool notification redirect URL
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}
# setx FRONTEND_BASE_URL "https://gosmartlib.be" # voor VM

# School seed (optional)
school.seed.domain=${SCHOOL_SEED_DOMAIN:}
school.seed.name=${SCHOOL_SEED_NAME:}
school.seed.oneroster-client-id=${SCHOOL_SEED_ONEROSTER_CLIENT_ID:}
school.seed.oneroster-client-secret=${SCHOOL_SEED_ONEROSTER_CLIENT_SECRET:}
school.seed.campus-name=${SCHOOL_SEED_CAMPUS_NAME:}
school.seed.campus-address=${SCHOOL_SEED_CAMPUS_ADDRESS:}
school.seed.campus-postal-code=${SCHOOL_SEED_CAMPUS_POSTAL_CODE:0}
school.seed.campus-contact-phone=${SCHOOL_SEED_CAMPUS_CONTACT_PHONE:}
school.seed.campus-contact-email=${SCHOOL_SEED_CAMPUS_CONTACT_EMAIL:}

# OneRoster user sync schedule (defaults to 03:00 Europe/Brussels)
oneroster.sync.cron=${ONE_ROSTER_SYNC_CRON:0 0 3 * * *}
oneroster.sync.zone=${ONE_ROSTER_SYNC_ZONE:Europe/Brussels}
oneroster.sync.interval-days=${ONE_ROSTER_SYNC_INTERVAL_DAYS:7}

# Mock mode toggle (false = block mock endpoints & schools, true = enable mock mode)
app.mock-mode-enabled=${MOCK_MODE_ENABLED:false}

# Dev mode toggle (false = disable dangerous dev-only operations like purge, true = enable)
app.dev-mode-enabled=${DEV_MODE_ENABLED:false}

# Admin promotion toggle (false = admins cannot promote others to admin, true = enable)
app.admin-promotion-enabled=${ADMIN_PROMOTION_ENABLED:false}
# Comma-separated list of real school domains (used in mock mode to redirect to real Smartschool)
app.real-school-domains=${REAL_SCHOOL_DOMAINS:}

# Mock OAuth2 client registration (for per-school mock flow)
spring.security.oauth2.client.registration.smartschool-mock.client-id=dev-mock-client
spring.security.oauth2.client.registration.smartschool-mock.client-secret=dev-mock-secret
spring.security.oauth2.client.registration.smartschool-mock.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.smartschool-mock.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool-mock.redirect-uri=${MOCK_BASE_URL}/api/login/oauth2/code/smartschool-mock
spring.security.oauth2.client.registration.smartschool-mock.scope=userinfo,fulluserinfo,groupinfo,sendmessage,sendnotif
spring.security.oauth2.client.registration.smartschool-mock.client-name=Smartschool (Mock)

spring.security.oauth2.client.provider.smartschool-mock.authorization-uri=${MOCK_BASE_URL}/api/OAuth/index/authorize
spring.security.oauth2.client.provider.smartschool-mock.token-uri=${MOCK_BASE_URL}/api/OAuth/index/token
spring.security.oauth2.client.provider.smartschool-mock.user-info-uri=${MOCK_BASE_URL}/api/Api/V1/fulluserinfo
spring.security.oauth2.client.provider.smartschool-mock.user-name-attribute=userID

# OAuth2 Provider
spring.security.oauth2.client.provider.smartschool.authorization-uri=https://oauth.smartschool.be/OAuth
spring.security.oauth2.client.provider.smartschool.token-uri=https://oauth.smartschool.be/OAuth/index/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=https://oauth.smartschool.be/Api/V1/fulluserinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=userID

# Logging
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.springframework.security=DEBUG

google.books.api.key=${BOOKS_API_KEY}

logging.level.org.springframework.web.client=INFO
logging.level.org.springframework.security.oauth2=TRACE
logging.level.edu.ap.bib_backend.interceptor=DEBUG
logging.level.edu.ap.bib_backend.service.SmartschoolMessageService=DEBUG


smartschool.fulluserinfo-url=https://oauth.smartschool.be/Api/V1/fulluserinfo
smartschool.groupinfo-url=https://oauth.smartschool.be/Api/V1/groupinfo
frontend.redirect-url=${FRONTEND_REDIRECT_URL:http://localhost:4200/login}

# Enkel actief wanneer DEV_MODE_ENABLED=true
admin.override.ttl-minutes=30

app.book-upload-temp-dir=/tmp/book-uploads

# School soft-deletion configuration
school.deletion.grace-period-days=${SCHOOL_DELETION_GRACE_PERIOD_DAYS:30}
school.deletion.check-cron=${SCHOOL_DELETION_CHECK_CRON:0 0 2 * * *}
