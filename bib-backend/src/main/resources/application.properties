spring.application.name=bib-backend

# Database connectie (pas wachtwoord aan!)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_USER_PASS}
server.port=${SPRING_PORT}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate instellingen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Vertrouw de headers die Traefik doorgeeft (zoals X-Forwarded-Proto)
server.forward-headers-strategy=framework
# Optioneel: als je Spring Security hebt, zet dit aan om te zien wat er gebeurt
logging.level.org.springframework.security=DEBUG

google.books.api.key=${BOOKS_API_KEY}