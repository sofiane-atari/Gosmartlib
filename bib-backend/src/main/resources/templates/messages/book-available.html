<div style="font-family: 'Segoe UI', Calibri, Arial, sans-serif; max-width: 600px; margin: 0 auto; color: #1a0a10; border: 1px solid #e8d5dc; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(138, 30, 65, 0.08);">
    <style>
        .msg-btn-primary { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important; }
        .msg-btn-primary:hover { background-color: #6b1532 !important; transform: translateY(-1px) !important; box-shadow: 0 4px 14px rgba(138, 30, 65, 0.35) !important; }
        .msg-book-link { transition: color 0.2s ease !important; }
        .msg-book-link:hover { color: #8a1e41 !important; }
        .msg-book-card { transition: all 0.2s ease !important; }
        .msg-book-card:hover { background-color: #fdf0f5 !important; border-color: #d4b0bc !important; }
        .msg-cover-link { transition: opacity 0.2s ease !important; }
        .msg-cover-link:hover { opacity: 0.85 !important; }
    </style>
    <div style="background: linear-gradient(135deg, #8a1e41 0%, #a82550 100%); color: white; padding: 28px 20px; text-align: center;">
        <h2 style="margin: 0; font-size: 22px; font-weight: 600;">{{TITLE}}</h2>
    </div>
    <div style="padding: 24px 28px; background-color: #ffffff;">
        <div style="text-align: center; padding: 16px 0;">
            <p style="margin: 0 0 20px 0; font-size: 18px; line-height: 1.5; color: #8a1e41; font-weight: 600;">Het boek is opnieuw beschikbaar in de bibliotheek!</p>

            <div style="margin: 0 auto; display: {{BOOK_IMAGE_DISPLAY}};">
                <img src="{{BOOK_IMAGE_URL}}" alt="{{BOOK_TITLE}}" style="max-width: 200px; max-height: 280px; width: auto; height: auto; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: block; margin: 0 auto;">
            </div>
            <div style="width: 160px; height: 220px; display: {{BOOK_PLACEHOLDER_DISPLAY}}; align-items: center; justify-content: center; background-color: #f0e4e8; border-radius: 8px; color: #8a7580; font-size: 48px; margin: 0 auto;">&#128218;</div>

            <h2 style="margin: 20px 0 4px 0; font-size: 22px; font-weight: 700; color: #1a0a10; line-height: 1.3;">{{BOOK_TITLE}}</h2>

            <p style="margin: 0 0 8px 0; font-size: 15px; color: #8a7580; display: {{BOOK_AUTHOR_DISPLAY}};">{{BOOK_AUTHOR}}</p>

            <div style="margin: 8px 0 0 0; display: {{GENRES_DISPLAY}};">{{GENRE_BADGES_HTML}}</div>

            <p style="margin: 8px 0 0 0; font-size: 14px; color: #c98500; display: {{REVIEW_SCORE_DISPLAY}};">&#9733; {{REVIEW_SCORE}}</p>

            <p style="margin: 16px 0 0 0; font-size: 14px; color: #555; line-height: 1.6; text-align: center; display: {{DESCRIPTION_DISPLAY}};">{{BOOK_DESCRIPTION}}</p>

            <div style="margin-top: 24px;">
                <a href="{{BOOK_URL}}" class="msg-btn-primary" style="background-color: #8a1e41; color: white; padding: 13px 32px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; display: inline-block; border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;">Bekijk in catalogus</a>
            </div>
        </div>

        {{RECOMMENDATIONS_HTML}}
    </div>
    <div style="background-color: #faf5f7; padding: 16px 28px; text-align: center; font-size: 12px; color: #8a7580; border-top: 1px solid #f0e4e8;">
        Dit is een automatisch gegenereerd bericht. Gelieve niet te reageren.
    </div>
</div>
