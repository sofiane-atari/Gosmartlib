# Dev profile: Mock Smartschool OAuth + OneRoster via Spring controllers
# Start with: SPRING_PROFILES_ACTIVE=dev

# OAuth2 Provider -> Mock endpoints (same host, different paths)
spring.security.oauth2.client.provider.smartschool.authorization-uri=http://localhost:${server.port:8080}/api/OAuth/index/authorize
spring.security.oauth2.client.provider.smartschool.token-uri=http://localhost:${server.port:8080}/api/OAuth/index/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=http://localhost:${server.port:8080}/api/Api/V1/fulluserinfo

# Smartschool API -> Mock endpoints
smartschool.fulluserinfo-url=http://localhost:${server.port:8080}/api/Api/V1/fulluserinfo
smartschool.groupinfo-url=http://localhost:${server.port:8080}/api/Api/V1/groupinfo

# OneRoster -> Mock endpoints
oneroster.token-url=http://localhost:${server.port:8080}/api/ims/oneroster/token
oneroster.base-url=http://localhost:${server.port:8080}/api
oneroster.api-path=/ims/oneroster/v1p1
oneroster.allowed-host-suffixes=.smartschool.be,.mock.localhost,.test.localhost
oneroster.allow-private-hosts=true
oneroster.connect-timeout-ms=5000
oneroster.read-timeout-ms=7000
oneroster.token-auth-method=auto
oneroster.token-endpoint-mode=global

# OAuth2 Client Registration (mock credentials)
spring.security.oauth2.client.registration.smartschool.client-id=dev-mock-client
spring.security.oauth2.client.registration.smartschool.client-secret=dev-mock-secret
spring.security.oauth2.client.registration.smartschool.redirect-uri=http://localhost:8080/api/login/oauth2/code/smartschool

# Logging
logging.level.edu.ap.bib_backend.service.mock=DEBUG
