services:
  backend:
    build: ./
    container_name: spring-boot-app
    restart: on-failure
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_PORT: "${SPRING_PORT}"
      DB_HOST: "${DB_HOST}"
      DB_NAME: "${DB_NAME}"
      DB_PORT: "${DB_PORT}"
      DB_USER: "${DB_USER}"
      DB_USER_PASS: "${DB_USER_PASS}"
      BOOKS_API_KEY: "${BOOKS_API_KEY}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS}"
      BASE_URL: "${BASE_URL}"
      SMART_SCHOOL_CLIENT_ID: "${SMART_SCHOOL_CLIENT_ID}"
      SMART_SCHOOL_CLIENT_SECRET: "${SMART_SCHOOL_CLIENT_SECRET}"
      JWT_SECRET: "${JWT_SECRET}"
      FRONTEND_REDIRECT_URL: "${FRONTEND_REDIRECT_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      ONE_ROSTER_SYNC_CRON: "${ONE_ROSTER_SYNC_CRON}"
      ONE_ROSTER_SYNC_ZONE: "${ONE_ROSTER_SYNC_ZONE}"
      ONE_ROSTER_SYNC_INTERVAL_DAYS: "${ONE_ROSTER_SYNC_INTERVAL_DAYS}"
      JASYPT_ENCRYPTOR_PASSWORD: "${JASYPT_ENCRYPTOR_PASSWORD}"
      SCHOOL_SEED_DOMAIN: "${SCHOOL_SEED_DOMAIN}"
      SCHOOL_SEED_NAME: "${SCHOOL_SEED_NAME}"
      SCHOOL_SEED_CAMPUS_NAME: "${SCHOOL_SEED_CAMPUS_NAME}"
      SCHOOL_SEED_CAMPUS_ADDRESS: "${SCHOOL_SEED_CAMPUS_ADDRESS}"
      SCHOOL_SEED_CAMPUS_POSTAL_CODE: "${SCHOOL_SEED_CAMPUS_POSTAL_CODE}"
      SCHOOL_SEED_CAMPUS_CONTACT_PHONE: "${SCHOOL_SEED_CAMPUS_CONTACT_PHONE}"
      SCHOOL_SEED_CAMPUS_CONTACT_EMAIL: "${SCHOOL_SEED_CAMPUS_CONTACT_EMAIL}"
      SCHOOL_SEED_ONEROSTER_CLIENT_ID: "${SCHOOL_SEED_ONEROSTER_CLIENT_ID}"
      SCHOOL_SEED_ONEROSTER_CLIENT_SECRET: "${SCHOOL_SEED_ONEROSTER_CLIENT_SECRET}"
      MAX_UPLOAD_FILE_SIZE: "${MAX_UPLOAD_FILE_SIZE}"
      MAX_UPLOAD_REQUEST_SIZE: "${MAX_UPLOAD_REQUEST_SIZE}"
      MOCK_MODE_ENABLED: "${MOCK_MODE_ENABLED}"
      DEV_MODE_ENABLED: "${DEV_MODE_ENABLED}"
      REAL_SCHOOL_DOMAINS: "${REAL_SCHOOL_DOMAINS}"
      SCHOOL_DELETION_GRACE_PERIOD_DAYS: "${SCHOOL_DELETION_GRACE_PERIOD_DAYS}"
      SCHOOL_DELETION_CHECK_CRON: "${SCHOOL_DELETION_CHECK_CRON}"
      ADMIN_PROMOTION_ENABLED: "${ADMIN_PROMOTION_ENABLED}"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`$DOMAIN`) && PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.docker.network=proxy"
    networks:
      - proxy

  mysql:
    image: mysql:8.0
    container_name: "${DB_HOST}"
    restart: always
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASS}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_USER_PASS}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - proxy
