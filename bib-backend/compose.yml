services:
  backend:
    build: ./
    container_name: spring-boot-app
    restart: on-failure
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_PORT: "${SPRING_PORT}"
      DB_HOST: "${DB_HOST}"
      DB_NAME: "${DB_NAME}"
      DB_PORT: "${DB_PORT}"
      DB_USER: "${DB_USER}"
      DB_USER_PASS: "${DB_USER_PASS}"
      BOOKS_API_KEY: "${BOOKS_API_KEY}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS}"
      BASE_URL: "${BASE_URL}"
      SMART_SCHOOL_CLIENT_ID: "${SMART_SCHOOL_CLIENT_ID}"
      SMART_SCHOOL_CLIENT_SECRET: "${SMART_SCHOOL_CLIENT_SECRET}"
      JWT_SECRET: "${JWT_SECRET}"
      FRONTEND_REDIRECT_URL: "${FRONTEND_REDIRECT_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      API_URL: "${API_URL}"
      ONE_ROSTER_CLIENT_ID: "${ONE_ROSTER_CLIENT_ID}"
      ONE_ROSTER_CLIENT_SECRET: "${ONE_ROSTER_CLIENT_SECRET}"
      ONE_ROSTER_SEED_SCHOOL_DOMAIN: "${ONE_ROSTER_SEED_SCHOOL_DOMAIN}"
      ONE_ROSTER_SEED_CLIENT_ID: "${ONE_ROSTER_SEED_CLIENT_ID}"
      ONE_ROSTER_SEED_CLIENT_SECRET: "${ONE_ROSTER_SEED_CLIENT_SECRET}"
      ONE_ROSTER_SYNC_CRON: "${ONE_ROSTER_SYNC_CRON}"
      ONE_ROSTER_SYNC_ZONE: "${ONE_ROSTER_SYNC_ZONE}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      JASYPT_ENCRYPTOR_PASSWORD: "${JASYPT_ENCRYPTOR_PASSWORD}"
      SCHOOL_SEED_DOMAIN: "${SCHOOL_SEED_DOMAIN}"
      SCHOOL_SEED_NAME: "${SCHOOL_SEED_NAME}"
      SCHOOL_SEED_ADDRESS: "${SCHOOL_SEED_ADDRESS}"
      SCHOOL_SEED_POSTAL_CODE: "${SCHOOL_SEED_POSTAL_CODE}"
      SCHOOL_SEED_CONTACT_PHONE: "${SCHOOL_SEED_CONTACT_PHONE}"
      SCHOOL_SEED_CONTACT_EMAIL: "${SCHOOL_SEED_CONTACT_EMAIL}"
      SCHOOL_SEED_ONEROSTER_CLIENT_ID: "${SCHOOL_SEED_ONEROSTER_CLIENT_ID}"
      SCHOOL_SEED_ONEROSTER_CLIENT_SECRET: "${SCHOOL_SEED_ONEROSTER_CLIENT_SECRET}"
      MAX_UPLOAD_FILE_SIZE: "${MAX_UPLOAD_FILE_SIZE}"
      MAX_UPLOAD_REQUEST_SIZE: "${MAX_UPLOAD_REQUEST_SIZE}"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`$DOMAIN`) && PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.docker.network=proxy"
    networks:
      - proxy

  mysql:
    image: mysql:8.0
    container_name: "${DB_HOST}"
    restart: always
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASS}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_USER_PASS}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - proxy
