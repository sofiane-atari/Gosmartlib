services:
  frontend:
    build: ./
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`$DOMAIN`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.middlewares.frontend-spa.errors.status=404"
      - "traefik.http.middlewares.frontend-spa.errors.service=frontend"
      - "traefik.http.middlewares.frontend-spa.errors.query=/"
      - "traefik.http.routers.frontend.middlewares=frontend-spa"
    networks:
      - proxy
