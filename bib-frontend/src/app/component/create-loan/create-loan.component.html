<section class="loan-container">
	<header class="page-header">
		<p class="eyebrow">Uitleenbeheer</p>
		<h1>Lening aanmaken</h1>
		<p class="intro">Kies een gebruiker, selecteer één of meerdere beschikbare boeken en leg een terugbrengdatum
			vast.</p>
	</header>

	<app-user-selection-panel [isLoadingUsers]="isLoadingUsers()" [users]="users()" [selectedUser]="selectedUser()"
		[searchFirstname]="searchFirstname()" [searchLastname]="searchLastname()" [searchId]="searchId()"
		(firstnameSearchChanged)="onFirstnameSearchChange($event)"
		(lastnameSearchChanged)="onLastnameSearchChange($event)" (searchIdChanged)="onSearchIdChange($event)"
		(searchRequested)="searchUsers()" (userSelected)="selectUser($event)"
		(clearSelectedUserRequested)="clearSelectedUser()" />

	<app-book-selection-panel [hasSelectedUser]="selectedUser() !== null" [selectedBooksCount]="selectedBooks().length"
		[searchQuery]="bookSearchQuery()" [searchIsbn]="bookSearchIsbn()" [isLoadingBooks]="isLoadingBooks()"
		[hasBookSearchInput]="hasBookSearchInput()" [filteredBooks]="filteredBooks()"
		(searchQueryChanged)="onBookSearchQueryChange($event)" (isbnSearchChanged)="onBookIsbnSearchChange($event)"
		(isbnKeydown)="onBookIsbnKeydown($event)" (addBookRequested)="addBook($event)" />

	<app-loan-summary-panel [loanForm]="loanForm" [minReturnDate]="minReturnDate()" [selectedBooks]="selectedBooks()"
		[hasSelectedUser]="selectedUser() !== null" [isSubmitting]="isSubmitting()" [filteredBooks]="filteredBooks()" (createLoanRequested)="createLoan()"
		(removeBookRequested)="removeBook($event)" />
</section>
