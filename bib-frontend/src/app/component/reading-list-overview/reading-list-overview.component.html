<div class="page">


  <!-- Page header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Mijn Leeslijsten</h1>
      <p class="page-subtitle">{{ readingLists.length }} leeslijst{{ readingLists.length !== 1 ? 'en' : '' }} aangemaakt
      </p>
    </div>
    <button class="btn-primary" routerLink="/reading-list/create">+ Nieuwe leeslijst</button>
  </div>

  <div class="content-layout">
    <!-- Left: cards -->
    <div class="cards-area">

      <!-- Empty state -->
      <div class="empty-state" *ngIf="readingLists.length === 0">
        <div class="empty-icon">📖</div>
        <h3>Nog geen leeslijsten</h3>
        <p>Maak je eerste leeslijst aan om boeken bij te houden.</p>
        <button class="btn-primary" routerLink="/reading-list/create">+ Nieuwe leeslijst aanmaken</button>
      </div>

      <!-- Grid of cards -->
      <div class="cards-grid" *ngIf="readingLists.length > 0">
        <div class="card" *ngFor="let list of readingLists">
          <div class="card-cover">📚</div>
          <div class="card-body">
            <h3 class="card-title">{{ list.name }}</h3>
            <p class="card-author">Leeslijst</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: purple widgets -->

    </div>
  </div>
