<div class="panel">
    <div class="panel-header">
        <div>
            <p class="panel-eyebrow">Uitleenbeheer</p>
            <h2>Controleer en bevestig</h2>
        </div>
    </div>

    <form [formGroup]="loanForm()" (ngSubmit)="createLoanRequested.emit()" class="loan-form">
        <div class="date-field">
            <label for="returnDate">Terugbrengdatum</label>
            <input id="returnDate" type="date" formControlName="returnDate" [attr.min]="minReturnDate()" />
        </div>

        <div class="selected-books">
            <div class="selected-books-header">
                <h3>Geselecteerde boeken</h3>
                <span class="pill">{{ selectedBooks().length }} gekozen</span>
            </div>
            @for (book of selectedBooks(); track trackSelectedBook($index, book)) {
            <div class="selected-book-row">
                <div class="selected-book-content">
                    <span class="selected-book-title">{{ book.title }}</span>
                    <span class="selected-book-subtitle">{{ book.author }}</span>
                </div>
                <button type="button" class="action-button action-button--danger"
                    (click)="removeBookRequested.emit(book.id)">Verwijderen</button>
            </div>
            } @empty {
            <div class="state-panel state-panel--compact">
                <p>Nog geen boeken geselecteerd.</p>
            </div>
            }
        </div>

        <button type="submit" class="action-button action-button--primary submit-btn"
            [disabled]="isSubmitting() || !hasSelectedUser() || selectedBooks().length === 0">
            @if (isSubmitting()) {
            Lening wordt aangemaakt...
            } @else {
            Lening aanmaken
            }
        </button>
    </form>
</div>
