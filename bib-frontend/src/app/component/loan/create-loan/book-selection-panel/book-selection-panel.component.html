<app-lesson-tip-book-selection-panel
  [panelEyebrow]="'Uitleenbeheer'"
  [panelTitle]="'Zoek en selecteer boeken'"
  [hasSelectedUser]="hasSelectedUser()"
  [searchQuery]="searchQuery()"
  [searchIsbn]="searchIsbn()"
  [isLoadingBooks]="isLoadingBooks()"
  [hasBookSearchInput]="hasBookSearchInput()"
  [filteredBooks]="bookCandidates()"
  [selectedBooksCount]="selectedBooksCount()"
  [selectedBookIds]="selectedBookIds()"
  [allowMultipleSelection]="true"
  (searchQueryChanged)="searchQueryChanged.emit($event)"
  (isbnSearchChanged)="isbnSearchChanged.emit($event)"
  (isbnKeydown)="isbnKeydown.emit($event)"
  (addBookRequested)="handleAddBookRequested($event)"
></app-lesson-tip-book-selection-panel>
