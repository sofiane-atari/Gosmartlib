<span class="button-hover-help">
  <ng-content></ng-content>

  @if (userSettingsService.hoverHelpEnabled$ | async) {
    <span
      #tooltipEl
      class="button-hover-help__text"
      [class.visible]="isVisible"
      [ngStyle]="tooltipStyle"
    >
      {{ text }}
      <span class="button-hover-help__arrow" [ngStyle]="arrowStyle"></span>
    </span>
  }
</span>
