<button
  class="smartschool-sso-btn"
  (click)="buttonClick.emit()"
  [disabled]="disabled()"
  type="button"
  aria-label="Aanmelden met Smartschool"
>
  <span class="smartschool-logo" aria-hidden="true">
    <img src="smartschool-s-logo-12x18.svg" alt="" class="smartschool-logo-image" />
  </span>

  <span class="divider" aria-hidden="true"></span>

  <span class="button-text">
    @if (loading()) {
        <span class="loading-text">Je wordt doorgestuurd...</span>
    }
    @if (!loading()) {
        <span>Smartschool</span>
    }
  </span>
</button>
