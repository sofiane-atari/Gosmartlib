@if (toast) {
  <div class="toast-container" [@fade]>
    <div class="toast" [ngClass]="toast.type">
      {{ toast.message }}

      @if (toast.type === 'confirm') {
        <div class="confirm-buttons">
          <button class="btn-yes" (click)="confirm()">Ja</button>
          <button class="btn-no" (click)="cancel()">Nee</button>
        </div>
      }
    </div>
  </div>
}
