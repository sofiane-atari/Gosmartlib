<div class="labels-list">
  <div class="labels-list__header">
    <span>Label</span>
    <span>Beschrijving</span>
    <span>Kleur</span>
    <span>Boeken</span>
    <span>Acties</span>
  </div>

  @for (label of labels(); track $index) {
    <app-label-card [label]="label" />
  }

  @if (labels().length === 0) {
    <div class="labels-list__empty">
      <p>Geen labels gevonden.</p>
    </div>
  }
</div>
