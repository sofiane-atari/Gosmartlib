<div class="labels-list">
  <div class="labels-list__header">
    <span>Label</span>
    <span>Beschrijving</span>
    <span>Kleur</span>
    <span>Boeken</span>
    <span>Acties</span>
  </div>

  <div class="labels-list__content">
    @for (label of labels(); track $index) {
      <app-label-card [label]="label" 
      (deletionError)="deletionError.emit($event)" 
      (deletedSuccess)="deletedSuccess.emit($event)"
      (editLabel)="editLabel.emit($event)" />
    }
  </div>

  @if (labels().length === 0) {
    <div class="labels-list__empty">
      <p>Geen labels gevonden.</p>
    </div>
  }
</div>
