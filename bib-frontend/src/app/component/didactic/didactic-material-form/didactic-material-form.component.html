<form class="material-form" (ngSubmit)="submitForm()">
  @if (validationMessage(); as validationMessage) {
    <div class="form-message form-message--error">
      {{ validationMessage }}
    </div>
  }

  <div class="form-row">
    <div class="form-group">
      <label for="title">Titel *</label>
      <input
        id="title"
        name="title"
        type="text"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        placeholder="Bijvoorbeeld begrijpend lezen met jeugdboeken"
      />
    </div>

    <div class="form-group">
      <label for="materialType">Categorie *</label>
      <select
        id="materialType"
        name="materialType"
        [ngModel]="materialType()"
        (ngModelChange)="materialType.set($event)"
      >
        @for (option of materialTypeOptions; track option.value) {
          <option [ngValue]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="form-group full-width">
    <label for="description">Beschrijving *</label>
    <textarea
      id="description"
      name="description"
      rows="6"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
      placeholder="Beschrijf waarvoor dit didactisch materiaal gebruikt kan worden"
    ></textarea>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="subject">Vak</label>
      <input
        id="subject"
        name="subject"
        type="text"
        [ngModel]="subject()"
        (ngModelChange)="subject.set($event)"
        placeholder="Bijvoorbeeld Nederlands"
      />
    </div>

    <div class="form-group">
      <label for="educationLevel">Niveau</label>
      <input
        id="educationLevel"
        name="educationLevel"
        type="text"
        [ngModel]="educationLevel()"
        (ngModelChange)="educationLevel.set($event)"
        placeholder="Bijvoorbeeld eerste graad"
      />
    </div>
  </div>

  <div class="form-group full-width">
    <label for="keywords">Trefwoorden</label>
    <input
      id="keywords"
      name="keywords"
      type="text"
      [ngModel]="keywords()"
      (ngModelChange)="keywords.set($event)"
      placeholder="Bijvoorbeeld lezen, evaluatie, taal"
    />
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? "Opslaan..." : submitLabel() }}
    </button>
  </div>
</form>
