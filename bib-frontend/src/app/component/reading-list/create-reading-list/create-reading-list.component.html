<div class="page">

  <!-- Page header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Nieuwe leeslijst</h1>
      <p class="page-subtitle">Maak een persoonlijke leeslijst aan</p>
    </div>
    <button type="button" class="btn-secondary" routerLink="/reading-list">Terug naar leeslijsten</button>
  </div>

  <div class="content-layout">
    <!-- Form card -->
    <div class="form-card">
      <div class="form-header">
        <h2 class="form-heading">Leeslijst aanmaken</h2>
      </div>

      <form (ngSubmit)="submit()">
        <div class="field-group">
          <label class="field-label" for="listName">Naam leeslijst</label>
          <input id="listName" class="field-input" [(ngModel)]="listName" name="listName"
            placeholder="Bijv. Favoriete romans" required autocomplete="off" />
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" routerLink="/reading-list">Annuleren</button>
          <button type="submit" class="btn-primary" [disabled]="!listName.trim()">Aanmaken</button>
        </div>
      </form>
    </div>


  </div>
</div>
