<div class="form-container">
  <h2>Nieuw Boek Toevoegen</h2>

  <div class="search-section">
    <input type="text" [(ngModel)]="isbn" placeholder="Scan of typ ISBN..." />
    <button type="button" class="btn-search" (click)="searchByISBN()">
      Zoek Gegevens
    </button>
  </div>

  <hr class="divider"/>

  <form (ngSubmit)="save()" #bookForm="ngForm" class="book-form">
    
    <div class="form-group">
      <label>Titel</label>
      <input type="text" [(ngModel)]="book.title" name="title" required>
    </div>

    <div class="form-group">
      <label>Auteur</label>
      <input type="text" [(ngModel)]="book.author" name="author" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Pagina's</label>
        <input type="number" [(ngModel)]="book.pages" name="pages">
      </div>
      <div class="form-group">
        <label>Jaar</label>
        <input type="number" [(ngModel)]="book.releaseYear" name="releaseYear">
      </div>
    </div>

    <div class="form-group">
      <label>Beschikbaarheid</label>
      <select [(ngModel)]="book.availability" name="availability">
        <option value="AVAILABLE">Beschikbaar</option>
        <option value="BORROWED">Uitgeleend</option>
        <option value="RESERVED">Gereserveerd</option>
        <option value="LOST">Verloren</option>
      </select>
    </div>

    <div class="form-group">
      <label>Aantal exemplaren</label>
      <input type="number" [(ngModel)]="book.copies" name="copies">
    </div>

    <div class="form-group">
      <label>Beschrijving</label>
      <textarea [(ngModel)]="book.description" name="description" rows="3"></textarea>
    </div>

    @if(book.imageUrl){
      <div class="image-preview">
        <label>Cover Preview</label>
        <img [src]="book.imageUrl" alt="Book cover">
      </div>
    }

    <button type="submit" class="btn-submit">
       Boek Opslaan
    </button>
  </form>
</div>
