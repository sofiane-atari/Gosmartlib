<div class="isbn-search">
    <input
        type="text"
        [(ngModel)]="isbn"
        placeholder="ISBN nummer"
    />

    <button (click)="searchByISBN()">
        Zoek boek
    </button>

    <label for=""> title</label>
    <input type="text" [(ngModel)]="book.title" name="title">
    <label for=""> author</label>
    <input type="text" [(ngModel)]="book.author" name="author">
    <label for=""> pages</label>
    <input type="number" [(ngModel)]="book.pages" name="pages">
    <label for=""> image_url</label>
    <input type="text" [(ngModel)]="book.image_url" name="image_url">
    <label for=""> release_year</label>
    <input type="number" [(ngModel)]="book.release_year" name="release_year">
    <label for=""> description</label>
    <input type="text" [(ngModel)]="book.description" name="description">
    <label for=""> copies</label>
    <input type="number" [(ngModel)]="book.copies" name="copies">

    <select name="availability" id="availability-select">
        <option value="AVAILABLE">Beschikbaar</option>
        <option value="BORROWED">Uitgeleend</option>
        <option value="DAMAGED">Gereserveerd</option>
        <option value="LOST">Verloren</option>
    </select>

    @if(book.image_url){
        <div>
            <img [src]="book.image_url" width="120">
        </div>
    }

</div>
