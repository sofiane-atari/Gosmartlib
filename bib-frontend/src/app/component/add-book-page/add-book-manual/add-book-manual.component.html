<div class="add-book-container">
  <h2>Boek Handmatig Toevoegen</h2>

  <form (ngSubmit)="addBook()" class="book-form">

    <div class="form-group">
      <label>ISBN</label>
      <input type="number" [(ngModel)]="book.ISBN" name="ISBN" required />
    </div>

    <div class="form-group">
      <label>Titel</label>
      <input type="text" [(ngModel)]="book.title" name="title" required />
    </div>

    <div class="form-group">
      <label>Auteur</label>
      <input type="text" [(ngModel)]="book.author" name="author" required />
    </div>

    <div class="form-group">
      <label>Pagina's</label>
      <input type="number" [(ngModel)]="book.pages" name="pages" required />
    </div>

    <div class="form-group">
      <label>Release Jaar</label>
      <input type="number" [(ngModel)]="book.release_year" name="release_year" required />
    </div>

    <div class="form-group">
      <label>Aantal Exemplaren</label>
      <input type="number" [(ngModel)]="book.copies" name="copies" required />
    </div>

    <div class="form-group">
      <label>Image URL</label>
      <input type="text" [(ngModel)]="book.image_url" name="image_url" />
    </div>

    <div class="form-group">
      <label>Beschrijving</label>
      <textarea [(ngModel)]="book.description" name="description"></textarea>
    </div>

    <div class="form-group">
      <label>Status</label>
      <select [(ngModel)]="book.availability" name="availability">
        <option value="AVAILABLE">AVAILABLE</option>
        <option value="BORROWED">BORROWED</option>
        <option value="DAMAGED">DAMAGED</option>
        <option value="LOST">LOST</option>
      </select>
    </div>

    <button type="submit" class="submit-btn">
      Boek Toevoegen
    </button>

  </form>
</div>
