<div class="layout">
  <div class="info-banner">
    <lucide-icon [name]="InfoIcon" class="info-icon"></lucide-icon>

    <div class="info-content">
      <p><strong>Boeken manueel toevoegen</strong></p>
      <p>
        Gebruik dit formulier om boeken of items toe te voegen die geen ISBN-nummer hebben.
        Denk bijvoorbeeld aan <strong>poëziebundels van leerlingen</strong>,
        <strong>schoolpublicaties</strong> of <strong>tijdschriften en magazines</strong>.
      </p>
    </div>
  </div>

  <form (ngSubmit)="save()" #bookForm="ngForm" class="book-form">
    <div class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>Titel *</label>
          <input type="text" [(ngModel)]="book.title" name="title" placeholder="Titel" required />
        </div>
        <div class="form-group">
          <label>Auteur *</label>
          <input type="text" [(ngModel)]="book.author" name="author" placeholder="Auteur" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Aantal Pagina's *</label>
          <input type="number" [(ngModel)]="book.pages" name="pages" placeholder="320" required />
        </div>
        <div class="form-group">
          <label>Jaar *</label>
          <input type="number" [(ngModel)]="book.releaseYear" name="releaseYear" placeholder="2024" required />
        </div>
      </div>

      <div class="form-group full-width">
        <label>Cover URL (optioneel)</label>
        <input type="text" [(ngModel)]="book.imageUrl" name="imageUrl" placeholder="https://..." />
      </div>

      <div class="form-group full-width description-field">
        <label>Beschrijving *</label>
        <textarea
          [(ngModel)]="book.description"
          name="description"
          placeholder="Een korte beschrijving van het boek..."
          required
        ></textarea>
      </div>

      <div class="form-group full-width genre-section">
        <label>Genres * (selecteer minimaal 1)</label>
        <div class="genre-grid">
          @for (genre of genres; track genre.name) {
            <div 
              class="genre-option"
              [class.selected]="isGenreSelected(genre.name)"
              [style.background-color]="isGenreSelected(genre.name) ? genre.color + '33' : '#f5f5f5'"
              [style.color]="isGenreSelected(genre.name) ? genre.color : '#666'"
              [style.border-color]="isGenreSelected(genre.name) ? genre.color + '66' : '#e0e0e0'"
              (click)="toggleGenre(genre.name)"
            >
              <span class="genre-text">{{ genre.name }}</span>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn-submit"
        [disabled]="!bookForm.form.valid || book.genres.length === 0"
      >
        <lucide-icon [name]="PlusIcon" class="btn-icon"></lucide-icon>
        Boek Toevoegen
      </button>
    </div>
  </form>
</div>
