<div class="add-book-container">
  <main class="main-content full-page">
    <div class="content-header">
      <h1>Boek Toevoegen</h1>
      <div class="tab-buttons"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn"
        [class.active]="mode === 'isbn'"
        (click)="mode = 'isbn'">
        Met ISBN
      </button>

      <button class="tab-btn"
        [class.active]="mode === 'manual'"
        (click)="mode = 'manual'">
        Manueel
      </button>

      <button class="tab-btn"
        [class.active]="mode === 'bulk'"
        (click)="mode = 'bulk'">
        Bulk
      </button>
    </div>

    @if (!isLoadingGenres && !isLoadingReadingLevels && mode === 'isbn') {
      <app-add-book-isbn
        [genres]="genres"
        [readingLevels]="readingLevels"
        (bookAdded)="addBook($event)">
      </app-add-book-isbn>
    }

    @if (!isLoadingGenres && !isLoadingReadingLevels && mode === 'manual') {
      <app-add-book-manual
        [genres]="genres"
        [readingLevels]="readingLevels"
        (bookAdded)="addBook($event)">
      </app-add-book-manual>
    }

    @if (mode === 'bulk') {
      <app-add-book-bulk></app-add-book-bulk>
    }
  </main>
</div>
