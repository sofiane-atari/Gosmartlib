<div class="add-book-container">
  <main class="main-content full-page">
    <div class="content-header">
      <h1>Boek Toevoegen</h1>
      <div class="tab-buttons">
      </div>
    </div>
  <div class="tabs">
    <button class="tab-btn active"
      [class.active]="mode === 'isbn'"
      (click)="mode = 'isbn'">
      Met ISBN
    </button>

    <button class="tab-btn"
      [class.active]="mode === 'manual'"
      (click)="mode = 'manual'">
      Zonder ISBN
    </button>
  </div>

  @if(mode === 'isbn') {
    <app-add-book-isbn></app-add-book-isbn>
  }

  @if(mode === 'manual') {
    <app-add-book-manual></app-add-book-manual>
  }
  </main>

</div>
