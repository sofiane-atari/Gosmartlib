<div class="layout">
  <div class="info-banner">
  <lucide-icon [name]= "InfoIcon" class="info-icon"></lucide-icon>
  <div class="info-content">
    <p><strong>Boeken in bulk toevoegen</strong></p>
    <p>
      Download eerst het <strong>Excel-template</strong> en vul de vereiste velden in met de gegevens van de boeken.
      Upload daarna het ingevulde bestand en klik op <strong>"Boeken toevoegen"</strong> om alle boeken
      tegelijk aan de bibliotheek toe te voegen.
    </p>
  </div>
  </div>
  <div class="bulk-upload">

  <button class="btn-download" (click)="downloadTemplate()">
    Download Template
  </button>

  <input type="file"
         (change)="onFileSelected($event)"
         accept=".xlsx"/>

  <button class="btn-submit"
          (click)="uploadBooks()"
          [disabled]="!selectedFile">
    Boeken toevoegen
  </button>

</div>
</div>
