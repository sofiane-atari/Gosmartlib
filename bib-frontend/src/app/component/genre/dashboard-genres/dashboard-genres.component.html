<div class="genre-dashboard">
  <header class="page-header">
    <div class="page-header__text">
      <h1>Genrebeheer</h1>
      <p>Beheer alle genres die gebruikt worden om boeken te categoriseren.</p>
    </div>

    <button type="button" class="btn-new" (click)="openCreatePopup()">
      <lucide-icon [name]="Plus" class="icon-sm"></lucide-icon>
      Nieuw genre
    </button>
  </header>

  @if (success()) {
    <div class="success-message">
      {{ success() }}
    </div>
  }

  @if (errors().length > 0) {
    <div class="error-message">
      @for (error of errors(); track error.field) {
        <p>{{ error.message }}</p>
      }
    </div>
  }

  <section class="stat-cards">
    <app-stat-card
      label="Totaal genres"
      [value]="stats()?.totalItems ?? 0"
      [icon]="Tag"
      variant="purple"
      helpText="Het totaal aantal genres dat in het systeem bestaat."
    ></app-stat-card>

    <app-stat-card
      label="Gebruikte genres"
      [value]="totalActive()"
      [icon]="BookOpen"
      variant="green"
      helpText="Het aantal genres dat momenteel aan minstens één boek gekoppeld is."
    ></app-stat-card>

    <app-stat-card
      label="Ongebruikte genres"
      [value]="stats()?.unActiveGenres ?? 0"
      [icon]="CircleOff"
      variant="orange"
      helpText="Het aantal genres dat nog niet aan boeken gekoppeld is."
    ></app-stat-card>
  </section>

  <section class="controls-row">
    <div class="search-panel">
      <app-search-bar
        placeholder="Zoek op genre..."
        (searchChange)="onSearch($event)"
      ></app-search-bar>
    </div>

    <div class="filter-panel">
      <label class="filter-label" for="bookCountFilter">Aantal boeken</label>

      <input
        id="bookCountFilter"
        class="filter-input"
        type="number"
        min="0"
        [ngModel]="bookCountFilter()"
        (ngModelChange)="onBookCountFilterChange($event)"
        placeholder="Aantal boeken"
      />
    </div>
  </section>

  <section class="genres-section">
    <div class="genres-list-wrapper">
      <app-genres-list
        [genres]="genres()"
        (deletedSuccess)="onSuccess($event)"
        (deletionError)="onError($event)"
        (editGenre)="onEditGenre($event)"
      ></app-genres-list>
    </div>
  </section>

  @if (pagingMeta()) {
    <div class="paging-wrapper">
      <app-paging
        [meta]="pagingMeta()"
        (pageChange)="onPageChange($event)"
      ></app-paging>
    </div>
  }

  <app-name-description-modal
    [isOpen]="popUp() === 'create'"
    mode="create"
    title="Genre toevoegen"
    subtitle="Maak een nieuw genre aan om boeken beter te categoriseren."
    nameLabel="Naam"
    descriptionLabel="Beschrijving"
    colorLabel="Kleur"
    namePlaceholder="Bijvoorbeeld: Avontuur"
    descriptionPlaceholder="Korte beschrijving van het genre"
    [showColor]="true"
    initialColor="#3b82f6"
    submitLabel="Genre toevoegen"
    (closed)="closePopup()"
    (submitted)="onSubmitCreateGenre($event)"
  ></app-name-description-modal>

  <app-name-description-modal
    [isOpen]="popUp() === 'edit'"
    mode="edit"
    title="Genre bewerken"
    subtitle="Pas de naam, beschrijving of kleur van dit genre aan."
    nameLabel="Naam"
    descriptionLabel="Beschrijving"
    colorLabel="Kleur"
    namePlaceholder="Bijvoorbeeld: Avontuur"
    descriptionPlaceholder="Korte beschrijving van het genre"
    [showColor]="true"
    [initialName]="editingGenre()?.name ?? ''"
    [initialDescription]="editingGenre()?.description ?? ''"
    [initialColor]="editingGenre()?.color ?? '#3b82f6'"
    submitLabel="Genre opslaan"
    (closed)="closePopup()"
    (submitted)="onSubmitUpdateGenre($event)"
  ></app-name-description-modal>
</div>
