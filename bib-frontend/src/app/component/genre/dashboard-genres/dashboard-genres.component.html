<div class="dashboard-labels">
  <!-- Header -->
  <div class="page-header">
    <div class="page-header__text">
      <h1>Genrebeheer</h1>
      <p>Beheer genres voor de boekencatalogus</p>
    </div>

    <button class="btn-new" (click)="setPopup('create')">
      + Nieuw genre
    </button>
  </div>

  <div [class.blur-background]="popUp() !== null">
    @if (success()) {
      <div class="success-message">
        {{ success() }}
      </div>
    }

    @if (errors().length > 0) {
      <div class="error-message">
        @for (err of errors(); track err.field) {
          <p>{{ err.message }}</p>
        }
      </div>
    }

    @if (popUp() === "create") {
      <app-create-genre
        (closeEvent)="closePopup()"
        (successEvent)="onSuccess($event)"
        (errorEvent)="onError($event)"
      />
    } @else if (popUp() === "edit") {
      <app-update-genre
        [genre]="editingGenre()"
        (closeEvent)="closePopup()"
        (successEvent)="onSuccess($event)"
        (errorEvent)="onError($event)"
      />
    }
  </div>

  <!-- StatCards -->
  <div class="stat-cards">
    <app-button-hover-help
      class="stat-card-hover"
      text="Dit is het totaal aantal genres in de boekencatalogus.">
      <app-stat-card
        label="Totaal genres"
        [value]="stats()?.totalItems ?? 0"
        variant="total"
      />
    </app-button-hover-help>

    <app-button-hover-help
      class="stat-card-hover"
      text="Dit is het aantal genres dat gebruikt wordt bij één of meerdere boeken.">
      <app-stat-card
        label="Gebruikte genres"
        [value]="totalActive()"
        variant="active"
      />
    </app-button-hover-help>

    <app-button-hover-help
      class="stat-card-hover"
      text="Dit is het aantal genres dat nog niet gekoppeld is aan boeken.">
      <app-stat-card
        label="Ongebruikte genres"
        [value]="stats()?.unActiveGenres ?? 0"
        variant="unused"
      />
    </app-button-hover-help>
  </div>

  <!-- SearchBar -->
  <app-search-bar (searchChange)="onSearch($event)" />

  <!-- BookCount Filter -->
  <div class="filter-row">
    <label class="filter-label">Filter op aantal boeken:</label>
    <input
      class="filter-select"
      [value]="bookCountFilter()"
      placeholder="bijv. 1"
      (change)="onBookCountFilterChange($any($event.target).value)"
    />
  </div>

  <!-- LabelsList -->
  <app-genres-list
    [genres]="genres()"
    (deletedSuccess)="onSuccess($event)"
    (deletionError)="onError($event)"
    (editGenre)="onEditGenre($event)"
  />

  <!-- Paging -->
  @if (pagingMeta()) {
    <app-paging [meta]="pagingMeta()!" (pageChange)="onPageChange($event)" />
  }
</div>
