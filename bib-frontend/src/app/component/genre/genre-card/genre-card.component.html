<div class="label-card">
  <div class="label-card__name">
    <span class="label-card__dot" [style.background]="genre().color"></span>
    {{ genre().name }}
  </div>

  <div class="label-card__desc">{{ genre().description }}</div>

  <div>
    <span class="label-card__color-badge" [style.background]="genre().color">
      {{ genre().color.toUpperCase() }}
    </span>
  </div>

  <div class="label-card__books">{{ genre().booksCount ?? 0 }} boeken</div>

  <div class="label-card__actions">
    <button class="action-btn action-btn--edit" title="Bewerken" (click)="onEdit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
    <button class="action-btn action-btn--delete" title="Verwijderen" (click)="onDelete()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
      </svg>
    </button>
  </div>
</div>
