<div class="tag-dashboard">
  <div class="page-header">
    <div class="page-header__text">
      <h1>Tagbeheer</h1>
      <p>Beheer tags voor de boekencatalogus.</p>
    </div>

    <button type="button" class="btn-new" (click)="openCreatePopup()">
      <lucide-icon [name]="Plus" class="icon-sm"></lucide-icon>
      Nieuwe tag
    </button>
  </div>

  <section class="stat-cards">
    <app-stat-card
      label="Totaal tags"
      [value]="stats().totalItems"
      [icon]="TagIcon"
      variant="purple"
      helpText="Dit is het totaal aantal tags in de boekencatalogus."
    ></app-stat-card>

    <app-stat-card
      label="Gebruikte tags"
      [value]="totalActive()"
      [icon]="CheckCircle"
      variant="green"
      helpText="Dit is het aantal tags dat gekoppeld is aan één of meerdere boeken."
    ></app-stat-card>

    <app-stat-card
      label="Ongebruikte tags"
      [value]="stats().unActiveTags"
      [icon]="CircleOff"
      variant="orange"
      helpText="Dit is het aantal tags dat nog niet gekoppeld is aan boeken."
    ></app-stat-card>
  </section>

  <section class="search-panel">
    <app-search-bar
      placeholder="Zoek tags op naam..."
      (searchChange)="onSearch($event)"
    ></app-search-bar>
  </section>

  <section class="filter-panel">
    <label class="filter-label">Filter op aantal boeken:</label>

    <input
      class="filter-select"
      [value]="bookCountFilter()"
      placeholder="bijv. 1"
      type="number"
      min="0"
      (change)="onBookCountFilterChange($any($event.target).value)"
    />
  </section>

  <app-data-table
    [data]="tags()"
    [columns]="columns"
    [emptyMessage]="'Geen tags gevonden.'"
    [pagingMeta]="pagingMeta()"
    (pageChange)="onPageChange($event)"
  >
    <ng-template cellTemplate="name" let-tag>
      <div class="tag-cell">
        <div class="tag-cell__icon">
          <lucide-icon [name]="TagIcon"></lucide-icon>
        </div>

        <div>
          <strong>{{ tag.name }}</strong>
        </div>
      </div>
    </ng-template>

    <ng-template cellTemplate="description" let-tag>
      @if (tag.description) {
        <div class="muted-block">
          <span>{{ tag.description }}</span>
        </div>
      } @else {
        <span class="table-placeholder">Geen beschrijving</span>
      }
    </ng-template>

    <ng-template cellTemplate="bookCount" let-tag>
      <span class="count-badge">
        {{ tag.bookCount ?? 0 }} boeken
      </span>
    </ng-template>

    <ng-template cellTemplate="actions" let-tag>
      <div class="table-actions">
        <app-button-hover-help text="Wijzig de gegevens van deze tag.">
          <button
            type="button"
            class="icon-button icon-button--edit"
            aria-label="Tag wijzigen"
            (click)="openEditPopup(tag)"
          >
            <lucide-icon [name]="Pencil"></lucide-icon>
          </button>
        </app-button-hover-help>

        <app-button-hover-help text="Verwijder deze tag uit de boekencatalogus.">
          <button
            type="button"
            class="icon-button icon-button--delete"
            aria-label="Tag verwijderen"
            (click)="deleteTag(tag)"
          >
            <lucide-icon [name]="Trash2"></lucide-icon>
          </button>
        </app-button-hover-help>
      </div>
    </ng-template>
  </app-data-table>

  <app-name-description-modal
    [isOpen]="popUp() === 'create'"
    mode="create"
    title="Tag toevoegen"
    subtitle="Maak een nieuwe tag aan om boeken beter te organiseren."
    nameLabel="Naam"
    descriptionLabel="Beschrijving"
    namePlaceholder="Bijvoorbeeld: Fantasy"
    descriptionPlaceholder="Korte beschrijving van de tag"
    submitLabel="Tag toevoegen"
    (closed)="closePopup()"
    (submitted)="onSubmitCreateTag($event)"
  ></app-name-description-modal>

  <app-name-description-modal
    [isOpen]="popUp() === 'edit'"
    mode="edit"
    title="Tag bewerken"
    subtitle="Pas de naam of beschrijving van deze tag aan."
    nameLabel="Naam"
    descriptionLabel="Beschrijving"
    namePlaceholder="Bijvoorbeeld: Fantasy"
    descriptionPlaceholder="Korte beschrijving van de tag"
    [initialName]="editingTag()?.name ?? ''"
    [initialDescription]="editingTag()?.description ?? ''"
    submitLabel="Tag opslaan"
    (closed)="closePopup()"
    (submitted)="onSubmitUpdateTag($event)"
  ></app-name-description-modal>
</div>
