<article
  class="badge-progress-card"
  [class.badge-progress-card--completed]="progress().completed"
>
  <div
    class="badge-progress-card__visual"
    [style.border-color]="progress().themeColor"
    [style.color]="progress().themeColor"
  >
    <span class="badge-progress-card__initial">{{ badgeInitial }}</span>
  </div>

  <div class="badge-progress-card__content">
    <div class="badge-progress-card__header">
      <div class="badge-progress-card__text">
        <h3 class="badge-progress-card__title">{{ progress().badgeName }}</h3>
        <p class="badge-progress-card__description">
          {{ progress().badgeDescription }}
        </p>
      </div>

      <span class="badge-progress-card__count">{{ progressLabel }}</span>
    </div>

    <div class="badge-progress-card__track" aria-hidden="true">
      <div
        class="badge-progress-card__fill"
        [style.width.%]="progress().progressPercentage"
        [style.background-color]="progress().themeColor"
      ></div>
    </div>

    @if (progress().completed) {
      <span class="badge-progress-card__completed">✓ Behaald</span>
    }
  </div>
</article>
