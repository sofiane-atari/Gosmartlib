<div class="container">
  <h2>Boeken Catalogus</h2>

  <div class="books-grid">
    @for (book of books; track book.id || $index) {
      <div class="book-card" (click)="toBookDetailPage(book)">
        <div class="book-image">
          <img [src]="book.imageUrl" [alt]="book.title" />
        </div>

        <div class="book-info">
          <h3 class="book-title">{{ book.title }}</h3>
          <p class="book-author">{{ book.author }}</p>
          <p class="book-description">{{ book.description }}</p>

          <div class="card-footer">
            <div class="pages">
              <lucide-icon [img]="Book" [size]="16"></lucide-icon>
              {{ book.pages }} pagina's
            </div>
            <button class="favorite-btn" (click)="toggleFavorite($event, book)">
              <lucide-icon [img]="Heart" [size]="20"></lucide-icon>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
