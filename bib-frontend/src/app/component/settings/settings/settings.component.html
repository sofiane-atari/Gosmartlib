<div class="setting-row">
  <div>
    <h3>Hover hulpinformatie</h3>
    <p>Toon extra uitleg wanneer je met je muis over knoppen beweegt.</p>
  </div>

  <label class="switch">
    <input
      type="checkbox"
      [checked]="userSettingsService.hoverHelpEnabled$ | async"
      (change)="toggleHoverHelp($event)"
    />
    <span class="slider"></span>
  </label>
</div>
