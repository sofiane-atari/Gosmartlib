<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffb056"/>
      <stop offset="100%" stop-color="#c45200"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#F28C28" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F28C28" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#7a2e00" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="shine" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="124" fill="url(#outerGlow)"/>
  <circle cx="128" cy="128" r="112" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#F28C28" stroke-width="6"/>
  <circle cx="128" cy="128" r="105" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <circle cx="128" cy="128" r="112" fill="url(#shine)"/>

  <!-- Clock face -->
  <circle cx="118" cy="118" r="54" fill="none" stroke="white" stroke-width="7"/>
  <!-- Clock center dot -->
  <circle cx="118" cy="118" r="4" fill="white"/>
  <!-- Hour ticks -->
  <line x1="118" y1="68" x2="118" y2="78" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="118" y1="158" x2="118" y2="168" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="68" y1="118" x2="78" y2="118" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="158" y1="118" x2="168" y2="118" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Clock hands: pointing to ~10:10 (classic watch position) -->
  <line x1="118" y1="118" x2="100" y2="96" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="118" y1="118" x2="138" y2="100" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Checkmark badge -->
  <circle cx="158" cy="158" r="28" fill="#c45200" stroke="white" stroke-width="5.5"/>
  <polyline points="146,158 155,168 172,148" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
