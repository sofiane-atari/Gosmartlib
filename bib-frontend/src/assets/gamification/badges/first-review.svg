<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6aaeff"/>
      <stop offset="100%" stop-color="#1a4fbe"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#4F8EF7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#1a3a9a" flood-opacity="0.6"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dy="2"/>
      <feComposite in2="SourceGraphic" operator="arithmetic" k2="-1" k3="1"/>
    </filter>
    <linearGradient id="shine" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="128" cy="128" r="124" fill="url(#outerGlow)"/>

  <!-- Main badge -->
  <circle cx="128" cy="128" r="112" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Outer border -->
  <circle cx="128" cy="128" r="112" fill="none" stroke="#4F8EF7" stroke-width="6"/>
  <!-- Inner border highlight -->
  <circle cx="128" cy="128" r="105" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>

  <!-- Shine overlay -->
  <circle cx="128" cy="128" r="112" fill="url(#shine)"/>

  <!-- Icon: speech bubble with star -->
  <!-- Speech bubble -->
  <path d="M80 88 Q78 82 84 78 L172 78 Q178 78 178 84 L178 138 Q178 144 172 144 L138 144 L124 160 L120 144 L84 144 Q78 144 78 138 Z"
        fill="none" stroke="white" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Star inside bubble -->
  <polygon points="128,96 133,112 150,112 137,122 142,138 128,128 114,138 119,122 106,112 123,112"
           fill="white" opacity="0.95"/>
</svg>
