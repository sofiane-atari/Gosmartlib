<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffb056"/>
      <stop offset="100%" stop-color="#c45200"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#F28C28" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F28C28" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#7a2e00" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="shine" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="124" fill="url(#outerGlow)"/>
  <circle cx="128" cy="128" r="112" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#F28C28" stroke-width="6"/>
  <circle cx="128" cy="128" r="105" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <circle cx="128" cy="128" r="112" fill="url(#shine)"/>

  <!-- Book stack (3 books) -->
  <!-- Bottom book (widest) -->
  <rect x="68" y="148" width="120" height="22" rx="5" fill="white" opacity="0.95"/>
  <rect x="68" y="148" width="14" height="22" rx="3" fill="white" opacity="0.5"/>

  <!-- Middle book -->
  <rect x="76" y="118" width="104" height="22" rx="5" fill="white" opacity="0.85"/>
  <rect x="76" y="118" width="14" height="22" rx="3" fill="white" opacity="0.45"/>

  <!-- Top book -->
  <rect x="84" y="88" width="88" height="22" rx="5" fill="white" opacity="0.75"/>
  <rect x="84" y="88" width="14" height="22" rx="3" fill="white" opacity="0.4"/>

  <!-- Cute worm peeking from top-right -->
  <circle cx="172" cy="82" r="12" fill="white" opacity="0.95"/>
  <circle cx="167" cy="78" r="4" fill="#c45200"/>
  <circle cx="177" cy="78" r="4" fill="#c45200"/>
  <!-- Eyes -->
  <circle cx="167" cy="77" r="1.5" fill="white"/>
  <circle cx="177" cy="77" r="1.5" fill="white"/>
  <!-- Smile -->
  <path d="M166 83 Q172 88 178 83" fill="none" stroke="#c45200" stroke-width="2" stroke-linecap="round"/>
  <!-- Worm body curving down -->
  <path d="M172 94 Q178 102 172 110 Q165 118 172 126" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
</svg>
