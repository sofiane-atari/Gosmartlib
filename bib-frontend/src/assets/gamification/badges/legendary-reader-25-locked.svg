<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">

  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3c3c4c"/>
      <stop offset="100%" stop-color="#18181f"/>
    </radialGradient>
    <filter id="ds"><feDropShadow dx="0" dy="6" stdDeviation="10"
      flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <circle cx="128" cy="128" r="124" fill="none"
          stroke="#D97706" stroke-width="10" opacity=".22"/>
  <circle cx="128" cy="128" r="112" fill="url(#bg)" filter="url(#ds)"/>
  <circle cx="128" cy="128" r="112" fill="none"
