        fill="none" stroke="#606070" stroke-width="6.5" stroke-linejoin="round"/>
  <line x1="128" y1="136" x2="128" y2="188" stroke="#606070" stroke-width="4" opacity=".55"/>
  <line x1="90"  y1="156" x2="118" y2="156" stroke="rgba(96,96,112,0.45)" stroke-width="4" stroke-linecap="round"/>
  <line x1="90"  y1="168" x2="112" y2="168" stroke="rgba(96,96,112,0.45)" stroke-width="4" stroke-linecap="round"/>
  <line x1="138" y1="156" x2="166" y2="156" stroke="rgba(96,96,112,0.45)" stroke-width="4" stroke-linecap="round"/>
  <line x1="144" y1="168" x2="166" y2="168" stroke="rgba(96,96,112,0.45)" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(128,148)">
    <rect x="-28" y="-2" width="56" height="44" rx="9"
          fill="#2a2a35" stroke="#606070" stroke-width="3.5"/>
    <path d="M-18,-2 v-16 a18,18 0 0,1 36,0 v16"
