  <!-- Crown jewels -->
  <circle cx="128" cy="92" r="9"  fill="rgba(96,96,112,0.45)" stroke="#606070" stroke-width="2.5" opacity=".9"/>
  <circle cx="96"  cy="106" r="6" fill="rgba(96,96,112,0.45)" stroke="#606070" stroke-width="2" opacity=".8"/>
  <circle cx="160" cy="106" r="6" fill="rgba(96,96,112,0.45)" stroke="#606070" stroke-width="2" opacity=".8"/>
  <!-- Open book below -->
  <path d="M76,146 Q76,140 82,140 L122,140 L128,136 L134,140 L174,140
