<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6aaeff"/>
      <stop offset="100%" stop-color="#1a4fbe"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#4F8EF7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#1a3a9a" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="shine" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="124" fill="url(#outerGlow)"/>
  <circle cx="128" cy="128" r="112" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#4F8EF7" stroke-width="6"/>
  <circle cx="128" cy="128" r="105" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <circle cx="128" cy="128" r="112" fill="url(#shine)"/>

  <!-- Book shape -->
  <rect x="76" y="72" width="72" height="92" rx="7" fill="none" stroke="white" stroke-width="7"/>
  <!-- Spine line -->
  <line x1="98" y1="72" x2="98" y2="164" stroke="white" stroke-width="5" opacity="0.5"/>
  <!-- Page lines -->
  <line x1="108" y1="94" x2="138" y2="94" stroke="white" stroke-width="4.5" opacity="0.8" stroke-linecap="round"/>
  <line x1="108" y1="108" x2="138" y2="108" stroke="white" stroke-width="4.5" opacity="0.8" stroke-linecap="round"/>
  <line x1="108" y1="122" x2="128" y2="122" stroke="white" stroke-width="4.5" opacity="0.8" stroke-linecap="round"/>

  <!-- Checkmark circle -->
  <circle cx="158" cy="158" r="26" fill="#1a4fbe" stroke="white" stroke-width="5"/>
  <polyline points="146,158 155,167 171,149" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
